name: Machine Learning Workflow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-mlflow-project:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install MLflow and Dependencies
      run: |
        pip install mlflow pandas scikit-learn

    - name: Run MLflow Project
      run: |
        mlflow run . --env-manager=local